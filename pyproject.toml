[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aminf"
description = "Command-line control for Angry Miao AM Infinity mice (.97, .100, .100R2)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["hidapi"]
version = "3.1.0"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
aminf = "aminf.cli:main"

[tool.setuptools]
packages = ["aminf", "aminf.race", "aminf.m100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
